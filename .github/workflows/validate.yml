# Checks every record against the schema (pipeline/validate.py).
# Required to pass before a pull request into main can be merged.
name: Validate data

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install jsonschema
        run: pip install jsonschema==4.25.1
      - name: Validate records
        run: python pipeline/validate.py
